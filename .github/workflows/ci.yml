name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: editorial_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_STAGE: development
      DATABASE_URL: postgres://postgres:test@localhost:5432/editorial_test
      DATABASE_MIGRATION_URL: postgres://postgres:test@localhost:5432/editorial_test
      RUN_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify editorial workflow on a separate PostgreSQL database
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workflow_test
          DATABASE_MIGRATION_URL: postgres://postgres:test@localhost:5432/workflow_test
          RUN_EDITORIAL_POSTGRES_TESTS: '1'
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U postgres workflow_test
          npm run db:migrate
          node --test test/editorial-workflow.test.mjs test/analysis-queue.test.mjs
      - run: npm run build

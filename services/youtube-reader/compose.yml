services:
  youtube-reader:
    image: v4c-browser-worker:local
    command: [node, /reader/reader.mjs]
    environment:
      HOME: /tmp
    ports:
      - 127.0.0.1:19333:19333
    volumes:
      - ./reader.mjs:/reader/reader.mjs:ro
      - ./comment-visibility.mjs:/reader/comment-visibility.mjs:ro
      - ./captions-bookmarklet.mjs:/reader/captions-bookmarklet.mjs:ro
      - ./profile:/profile
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 256mb
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=/opt/v4c/browser-worker/docker/seccomp-chromium.json
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:19333/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: '2'
